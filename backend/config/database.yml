default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "root") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", "3306") %>

# Development and test use only the primary database (BACKEND_PLAN.md H3):
# Solid Cache and Solid Queue run only in production.
development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "salary_management") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
# Intentionally ignore DB_NAME so dotenv cannot point tests at development.
test:
  primary:
    <<: *default
    database: salary_management_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "salary_management") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "salary_management") %>
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "salary_management") %>
    migrations_paths: db/cache_migrate
